server:
  port: 8080

spring:
  application:
    name: parking

  datasource:
    url: jdbc:postgresql://localhost:5432/parking
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        ddl-auto: none

logging:
  file:
   name: C:/Users/bsevi/Desktop/Java-Örneklendirme/Microservice-backend-parking-1/logs/application.log