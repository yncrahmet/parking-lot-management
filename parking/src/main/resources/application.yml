server:
  port: 8081

spring:
  application:
    name: parking
  config:
    import: "optional:configserver:http://localhost:8181"

  datasource:
    url: jdbc:postgresql://localhost:5433/parking
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 12345

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        ddl-auto: update
  boot:
    admin:
          client:
            url: "http://localhost:8192"

logging:
  file:
    name: parking.log
    max-history: 5
    max-size: 10MB

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"
    health:
      show-details: always
