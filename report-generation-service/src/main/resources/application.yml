server:
  port: 8083

spring:
  application:
    name: report-service

  datasource:
    url: jdbc:postgresql://localhost:5432/report-service
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 12345


  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
        ddl-auto: update

logging:
  file:
   name: C:/Users/log/application.log

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka