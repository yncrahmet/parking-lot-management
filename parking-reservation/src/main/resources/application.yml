server :
  port : 8090

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/reservation
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true




